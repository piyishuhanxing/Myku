<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>中国四大古桥数据可视化</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
    <header>
        <h1>走进中国四大古桥</h1>
        <div class="showTime"></div>
    </header>
    <script>
            var t = null;
            t = setTimeout(time, 1000);
            function time() {
                clearTimeout(t);
                dt = new Date();
                var y = dt.getFullYear();
                var mt = dt.getMonth() + 1;
                var day = dt.getDate();
                var h = dt.getHours();
                var m = dt.getMinutes();
                var s = dt.getSeconds();
                t = setTimeout(time, 1000);
            }
    </script>

    <section class="mainbox">
        <!-- 左侧列 -->
        <div class="column">
            <div class="panel bar">
                <h2>古桥修建年代</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
            <div class="panel line">
                <h2>四大古桥基本尺寸比较</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
            <div class="panel pie">
                <h2>游客量与文学作品数量对比</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
        </div>

        <!-- 中央列（地图模块） -->
        <div class="column">
            <div class="no"></div>
            <div class="map">
                <div class="map1"></div>
                <div class="map2"></div>
                <div class="map3"></div>
                <div class="chart" id="ancientBridgeMap"></div>
                <div class="map-legend">地图数据 © 阿里云DataV.GeoAtlas，审图号：GS(2025)5996</div>
            </div>
        </div>

        <!-- 右侧列 -->
        <div class="column">
            <div class="panel bar2">
                <h2>四大古桥文学作品类型分布</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
            <div class="panel line2">
                <h2>游客满意度评分雷达图</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
            <div class="panel pie2">
                <h2>四大名桥技术特征对比雷达图</h2>
                <div class="chart"></div>
                <div class="panel-footer"></div>
            </div>
        </div>
    </section>

    <script src="js/flexible.js"></script>
    <script src="js/echarts.min.js"></script>
    <script src="js/jquery.js"></script>
    <script src="js/china.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
